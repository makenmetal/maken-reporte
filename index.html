============================================================ */

    gap: 16px;
  }

<body>
<div id="app" class="wrap"><div class="spinner">Cargando catalogos...</div></div>
<script>
var SHEETS_URL = "https://script.google.com/macros/s/AKfycbw4gJ6wTPjJ33CiBVwiiIiUmNdZb1BOpSKohhpYSCxMn5RooH7veSotxG858veC5elrzQ/exec";
// *** PEGAR aquí la URL de deployment del Apps Script de MANTO (Sheet separado) ***
var SHEETS_MANTO_URL = "https://script.google.com/macros/s/AKfycbxmmVBd3oboRghG7iA-ppOqEvSDtRFnMNQ715FmQD3RLEU-zAtSP200wbeLXl2Js9GF/exec";
var OWNER_PIN = "9473";
var AREAS_FALLBACK = [
  {area:"Torno",maquinas:["Puma 1","Puma 2","Haas 1","Haas 2"]},
  {area:"Centro de Maquinado",maquinas:["Doosan 2","Doosan 3"]},
  {area:"Corte",maquinas:["Amada"]},
  {area:"Rectificado Exterior",maquinas:["BSA","Kellen"]},
  {area:"Rectificado Interior",maquinas:["Okamoto"]},
  {area:"Ensamble",maquinas:["Ensamble 1"]},
  {area:"Soldadura",maquinas:["Soldadura 1","Soldadura 2"]},
  {area:"Detallado",maquinas:["Detallado ZP","Detallado Final"]},
  {area:"Avellanado",maquinas:["Revolver"]},
  {area:"Roscado",maquinas:["Machueleadora"]}
];
var TIPOS_MANTO_DEFAULT = ["Preventivo","Correctivo","Predictivo"];
var OPS_POR_AREA = {
  "corte":["10a","10b","10c","10d"],"torno":["20a","20b","20c","20d"],
  "centro_maquinado":["50a","50b","50c","50d"],"rect_exterior":["90a","90b","90c","90d"],
  "rect_interior":["100a","100b","100c","100d"],"avellanado":["400a","400b","400c","400d"],
  "roscado":["500a","500b","500c","500d"],"ensamble":["700a","700b","700c","700d"],
  "soldadura":["800a","800b","800c","800d"],"detallado":["900a","900b","900c","900d"]
};
var CAT = null;

// AREAS se arma dinámicamente desde CAT.maquinas (filtrado por tipo)
function areasPrincipales(){
  if(!CAT||!CAT.maquinas||!CAT.maquinas.length)return AREAS_FALLBACK;
  var grp={},orden=[];
  CAT.maquinas.forEach(function(m){
    if(m.tipo&&m.tipo.toLowerCase()!=="principal")return;
    if(!grp[m.area]){grp[m.area]=[];orden.push(m.area);}
    grp[m.area].push(m.maquina);
  });
  return orden.map(function(a){return{area:a,maquinas:grp[a]};});
}
function areasTodas(){
  if(!CAT||!CAT.maquinas||!CAT.maquinas.length)return AREAS_FALLBACK;
  var grp={},orden=[];
  CAT.maquinas.forEach(function(m){
    if(!grp[m.area]){grp[m.area]=[];orden.push(m.area);}
    grp[m.area].push(m.maquina);
  });
  return orden.map(function(a){return{area:a,maquinas:grp[a]};});
}

var S = {
  view:"loading",empleado:null,loginError:false,esDueno:false,
  turno:getTurno(),fechaManual:null,tab:"produccion",sending:false,
  history:[],submitted:null,editando:null,
  prod:{maquina:"",partidas:[mkPartida()]},
  setup:{maquina:"",noParte:"",operacion:"",horas:"",ot:"",q:""},
  manto:{maquina:"",tipo:"",subtipo:"",descripcion:"",horas:""},
  // Dashboard de eficiencia por máquina (v11.2)
  dashboard:{
    periodo:"hoy",       // "hoy" | "semana" | "mes" | "custom"
    area:"all",          // "all" | nombre de área
    turno:"all",         // "all" | "1ro" | "3ro"
    orden:"eff-desc",    // "eff-desc" | "eff-asc" | "pzas"
    desde:"",            // solo si periodo=custom (YYYY-MM-DD)
    hasta:"",            // solo si periodo=custom (YYYY-MM-DD)
    // Selección múltiple de máquinas — [] = todas (default)
    maquinas:[],
    catalogoMaquinas:null,  // catálogo completo (cargado on-demand)
    // Estado del selector modal
    selectorMaqOpen:false,
    selectorMaqBusqueda:"",
    selectorMaqSeleccion:[],  // selección temporal antes de aplicar
    loading:false,
    data:null,
    // Modal de máquina expandida
    maqModal:{
      maquina:"",
      loading:false,
      data:null
    }
  },
  miturno:{fecha:getFechaHoy(),turno:getTurno(),loading:false,data:null},
  // Solicitudes
  sol:{
    subTab:"mias", // mias | por_aceptar | cola_manto | todas
    loading:false,data:null,filtro:"activas",
    // crear
    crear:{maquina:"",prioridad:"",maquinaParada:"",descripcion:"",showing:false},
    // detalle/avance
    viendo:null, // id
    detalleLoading:false,detalle:null,
    avance:{horas:"",tipo:"",subtipo:"",actividades:"",esCierre:false,showing:false},
    descartar:{showing:false,motivo:""},
    rechazar:{showing:false,motivo:""},
    editClasif:{showing:false,tipo:"",subtipo:""},
    directa:{showing:false,maquina:"",tipo:"",subtipo:"",actividades:"",horas:""}
  },
  // Panel dueño - ver reportes operador
  verOp:{empleadoSel:"",fecha:getFechaHoy(),turno:getTurno(),loading:false,data:null}
};

function mkPartida(){return{noParte:"",operacion:"",piezas:"",horas:"",ot:"",desc:"",q:""};}

function getTurno(){
  var h=new Date().getHours();
  return (h>=7&&h<19)?"1ro":"3ro";
}
function getFechaHoy(){
  var now=new Date();
  if(now.getHours()<7)now.setDate(now.getDate()-1);
  var d=String(now.getDate()).padStart(2,"0"),m=String(now.getMonth()+1).padStart(2,"0");
  return d+"/"+m+"/"+now.getFullYear();
}
function getFecha(){return S.fechaManual||getFechaHoy();}
function getHora(){return new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});}

function parsearTimestamp(ts){
  if(!ts||ts==="")return null;
  var partes=String(ts).split(" ");
  if(partes.length<2)return null;
  var fecha=partes[0].split("/");
  var hora=partes[1].split(":");
  if(fecha.length<3||hora.length<2)return null;
  return new Date(parseInt(fecha[2]),parseInt(fecha[1])-1,parseInt(fecha[0]),parseInt(hora[0]),parseInt(hora[1]),parseInt(hora[2]||0));
}

function getMaqArea(m){
  if(!m)return"";
  // Primero intenta del catálogo
  if(CAT&&CAT.maquinas){
    for(var i=0;i<CAT.maquinas.length;i++){
      if(CAT.maquinas[i].maquina===m){
        var a=(CAT.maquinas[i].area||"").toLowerCase();
        if(a.indexOf("roscado")>=0)return"roscado";
        if(a.indexOf("centro")>=0)return"centro_maquinado";
        if(a.indexOf("torno")>=0)return"torno";
        if(a.indexOf("interior")>=0)return"rect_interior";
        if(a.indexOf("exterior")>=0)return"rect_exterior";
        if(a.indexOf("avellan")>=0)return"avellanado";
        if(a.indexOf("corte")>=0)return"corte";
        if(a.indexOf("ensamble")>=0)return"ensamble";
        if(a.indexOf("soldadura")>=0)return"soldadura";
        if(a.indexOf("detallado")>=0)return"detallado";
        return"otro";
      }
    }
  }
  // Fallback: por nombre
  var s=m.toLowerCase();
  if(s.indexOf("machueleadora")>=0)return"roscado";
  if(s.indexOf("doosan")>=0)return"centro_maquinado";
  if(s.indexOf("puma")>=0||s.indexOf("haas")>=0)return"torno";
  if(s.indexOf("okamoto")>=0)return"rect_interior";
  if(s.indexOf("bsa")>=0||s.indexOf("kellen")>=0)return"rect_exterior";
  if(s.indexOf("revolver")>=0)return"avellanado";
  if(s.indexOf("amada")>=0)return"corte";
  if(s.indexOf("ensamble")>=0)return"ensamble";
  if(s.indexOf("soldadura")>=0)return"soldadura";
  if(s.indexOf("detallado")>=0)return"detallado";
  return"otro";
}
function getTipoOp(cod){
  var n=parseInt(cod);
  var lista=isNaN(n)?CAT.operaciones.filter(function(o){return String(o.codigo).toLowerCase()===String(cod).toLowerCase();}):CAT.operaciones.filter(function(o){return parseInt(o.codigo)===n;});
  return lista.length?lista[0].nombre:cod;
}
function opLabel(op,maq){
  var area=getMaqArea(maq);
  if(op==="50a"&&area==="centro_maquinado"){
    var r=CAT.operaciones.filter(function(o){return parseInt(o.codigo)===500;});
    return(r.length?r[0].nombre:"Roscado")+" ("+op+")";
  }
  return getTipoOp(op)+" ("+op+")";
}
function getOps(noParte,maq){
  if(!noParte||noParte==="Otro"||!CAT.partes[noParte])return[];
  var area=getMaqArea(maq);
  return Object.keys(CAT.partes[noParte]).filter(function(op){return!(op==="500a"&&area==="centro_maquinado");});
}
function getOpsParaMaquina(maq){return OPS_POR_AREA[getMaqArea(maq)]||["20a","20b","20c","20d"];}
function tiposMantoPrincipales(){
  if(CAT&&CAT.tiposmanto){
    if(CAT.tiposmanto.principales)return CAT.tiposmanto.principales;
    if(Array.isArray(CAT.tiposmanto)&&CAT.tiposmanto.length)return CAT.tiposmanto;
  }
  return TIPOS_MANTO_DEFAULT;
}
function tiposMantoSub(padre){
  if(CAT&&CAT.tiposmanto&&CAT.tiposmanto.sub&&CAT.tiposmanto.sub[padre])return CAT.tiposmanto.sub[padre];
  return[];
}
function tipoTieneSub(tipo){
  if(!tipo)return false;
  var subs=tiposMantoSub(tipo);
  return subs&&subs.length>0;
}
function parseClasificacion(s){
  // Convierte "Correctivo - Electrica" en {tipo:"Correctivo", subtipo:"Electrica"}
  if(!s)return{tipo:"",subtipo:""};
  var str=String(s);
  var idx=str.indexOf(" - ");
  if(idx<0)return{tipo:str,subtipo:""};
  return{tipo:str.substring(0,idx),subtipo:str.substring(idx+3)};
}

function fetchCat(a){return fetch(SHEETS_URL+"?action="+a,{method:"GET",mode:"cors",redirect:"follow"}).then(function(r){return r.json();});}
function enviar(data){return fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});}
function apiGet(params){
  var qs=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k]);}).join("&");
  return fetch(SHEETS_URL+"?"+qs,{method:"GET",mode:"cors",redirect:"follow"}).then(function(r){return r.json();});
}
function apiGetManto(params){
  if(!SHEETS_MANTO_URL||SHEETS_MANTO_URL.indexOf("PEGAR")>=0){
    return Promise.reject(new Error("SHEETS_MANTO_URL no configurado en reporte.html"));
  }
  var qs=Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k]);}).join("&");
  return fetch(SHEETS_MANTO_URL+"?"+qs,{method:"GET",mode:"cors",redirect:"follow"}).then(function(r){return r.json();});
}
function fetchCatManto(a){
  if(!SHEETS_MANTO_URL||SHEETS_MANTO_URL.indexOf("PEGAR")>=0){
    return Promise.resolve(null);
  }
  return fetch(SHEETS_MANTO_URL+"?action="+a,{method:"GET",mode:"cors",redirect:"follow"}).then(function(r){return r.json();});
}

// CARGAS DE DATOS
// ============================================================

function cargarResumen(){
  // El dueño ahora tiene Dashboard en lugar del panel resumen viejo
  cargarDashboard();
}
function cargarDashboard(){
  var d=S.dashboard;
  d.loading=true;d.data=null;render();
  var params={action:"dashboardEficiencia",periodo:d.periodo,area:d.area,turno:d.turno};
  if(d.periodo==="custom"){params.desde=d.desde;params.hasta=d.hasta;}
  // Si hay máquinas específicas seleccionadas, incluirlas en la petición
  if(d.maquinas&&d.maquinas.length>0){params.maquinas=d.maquinas.join(",");}
  apiGet(params)
    .then(function(r){S.dashboard.data=r;S.dashboard.loading=false;render();})
    .catch(function(){S.dashboard.data=null;S.dashboard.loading=false;render();});
}
function setDashboardPeriodo(p){
  S.dashboard.periodo=p;
  if(p==="custom"){
    // Default: últimos 7 días
    var hoy=new Date();
    var hace7=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()-7);
    var fmt=function(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
    if(!S.dashboard.desde)S.dashboard.desde=fmt(hace7);
    if(!S.dashboard.hasta)S.dashboard.hasta=fmt(hoy);
  }
  cargarDashboard();
}
function setDashboardArea(a){
  S.dashboard.area=a;
  cargarDashboard();
}
function setDashboardTurno(t){
  S.dashboard.turno=t;
  cargarDashboard();
}
function setDashboardOrden(o){
  S.dashboard.orden=o;
  render();
}
function aplicarRangoCustom(){
  var i1=document.getElementById("dashDesde");
  var i2=document.getElementById("dashHasta");
  if(!i1||!i2)return;
  S.dashboard.desde=i1.value;
  S.dashboard.hasta=i2.value;
  cargarDashboard();

function guardarEdicion(){
  var ed=S.editando;
  if(!ed||!ed.timestamp){alert("No se puede identificar el registro.");return;}
  if(!ed.maquina){alert("Selecciona una maquina.");return;}
  var esProd=ed.tipo==="Producción"||ed.tipo==="Produccion";
  var esSetup=ed.tipo==="Setup",esManto=ed.tipo==="Mantenimiento";
  var esOtro=ed.noParte&&String(ed.noParte).indexOf("Otro")===0;
  if((esProd||esSetup)&&!ed.noParte){alert("Selecciona un numero de parte.");return;}
  if((esProd||esSetup)&&!esOtro&&!ed.operacion){alert("Selecciona una operacion.");return;}
  if(esManto&&!ed.tipoManto){alert("Selecciona un tipo de mantenimiento.");return;}
  S.sending=true;render();
  var tipoOpCalc=ed.operacion?getTipoOp(ed.operacion):"";
  var params={
    action:"actualizar",
    timestamp:ed.timestamp,
    empleado:S.empleado.numero,
    dueno:S.esDueno?"1":"0",
    maquina:ed.maquina||"",
    noParte:ed.noParte||"",
    ordenTrabajo:ed.ordenTrabajo||"",
    tipoOperacion:tipoOpCalc,
    operacion:ed.operacion||"",
    piezas:ed.piezas||"",
    horasSetup:ed.horasSetup||"",
    horasManto:ed.horasManto||"",
    tipoManto:ed.tipoManto||"",
    descripcion:ed.descripcion||""
  };
  apiGet(params).then(function(res){
    if(res.ok){
      S.editando=null;S.sending=false;
      if(S.esDueno){S.verOp.data=null;cargarVerOperador();}
      else{S.miturno.data=null;cargarMiTurno();}
    } else{alert("Error: "+(res.error||"intenta de nuevo"));S.sending=false;render();}
  }).catch(function(){alert("Error de conexion.");S.sending=false;render();});
}
function borrarRegistro(lista,idx){
  var r=lista[idx];
  if(!r||!r.timestamp){alert("No se puede identificar el registro.");return;}
  if(!S.esDueno){
    var tsDate=parsearTimestamp(r.timestamp),ahora=new Date();
    if(tsDate&&((ahora-tsDate)/3600000>72)){alert("Solo puedes borrar registros de los ultimos 3 dias.");return;}
  }
  var resumen=r.tipo+" - "+r.maquina+(r.noParte?" ("+r.noParte+")":"");
  if(!confirm("Borrar este registro?\n\n"+resumen+"\n\nEsta accion no se puede deshacer.")){return;}
  S.sending=true;render();
  apiGet({action:"borrar",timestamp:r.timestamp,empleado:S.empleado.numero,dueno:S.esDueno?"1":"0"})
    .then(function(res){
      if(res.ok){
        S.sending=false;
        if(S.esDueno){S.verOp.data=null;cargarVerOperador();}
        else{S.miturno.data=null;cargarMiTurno();}
      } else{alert("Error: "+(res.error||"intenta de nuevo"));S.sending=false;render();}
    }).catch(function(){alert("Error de conexion.");S.sending=false;render();});
}
function editarRegistro(lista,idx){
  var r=lista[idx];
  if(!S.esDueno){
    var tsDate=parsearTimestamp(r.timestamp),ahora=new Date();
    if(r.timestamp&&tsDate&&((ahora-tsDate)/3600000>72)){alert("Solo puedes editar registros de los ultimos 3 dias.");return;}
  }
  var ed={};for(var k in r)ed[k]=r[k];ed.idx=idx;
  var np=String(ed.noParte||"");
  ed.q=np.indexOf("Otro")===0?"Otro":np;
  S.editando=ed;render();
}

function sendCrearSolicitud(){
  var c=S.sol.crear;

  if(!c.prioridad){alert("Selecciona prioridad.");return;}

  S.sending=true;render();
  apiGetManto({
    action:"crearSolicitud",

    maquinaParada:c.prioridad==="Urgente"?c.maquinaParada:"",

function sendCrearAvance(){
  var a=S.sol.avance,id=S.sol.viendo;
  var sol=S.sol.detalle&&S.sol.detalle.solicitud?S.sol.detalle.solicitud:null;
  var yaTieneClasif=sol&&sol.clasificacion&&String(sol.clasificacion).trim()!=="";
  // Solo pedir clasificación si la solicitud no la tiene
  if(!yaTieneClasif){
    if(!a.tipo){alert("Selecciona clasificacion.");return;}
    if(tipoTieneSub(a.tipo)&&!a.subtipo){alert("Selecciona subcategoria.");return;}
  }
  if(!a.actividades||a.actividades.trim().length<5){alert("Describe las actividades realizadas.");return;}
  if(!a.horas||parseFloat(a.horas)<=0){alert("Indica horas invertidas.");return;}
  var clasFinal=yaTieneClasif?"":(a.subtipo?(a.tipo+" - "+a.subtipo):a.tipo);
  S.sending=true;render();
  apiGetManto({
    action:"crearAvance",
    idSolicitud:id,
    tecnico:S.empleado.numero+" - "+S.empleado.nombre,
    horas:a.horas,
    clasificacion:clasFinal,
    actividades:a.actividades,
    esCierre:a.esCierre?"1":"0"
  }).then(function(res){
    S.sending=false;
    if(res.ok){
      S.sol.avance={horas:"",tipo:"",subtipo:"",actividades:"",esCierre:false,showing:false};
      cargarDetalleSolicitud(id);
    }else{alert("Error: "+(res.error||"intenta de nuevo"));render();}
  }).catch(function(){S.sending=false;alert("Error de conexion.");render();});
}

function doLogin(val){
  var str=String(val).trim();
  if(str===OWNER_PIN){
    S.esDueno=true;
    S.empleado={numero:"9473",nombre:"Dueño",puedeSolicitar:true,puedeAceptar:true,esManto:true,puedeReportarManto:true};
    S.view="resumen";cargarResumen();render();return;
  }
  var n=parseInt(str),emp=null;
  for(var i=0;i<CAT.empleados.length;i++){
    if(parseInt(CAT.empleados[i].numero)===n){emp=CAT.empleados[i];break;}
  }
  if(emp){
    S.empleado=emp;S.esDueno=false;S.loginError=false;
    // Tab inicial según rol
    if(emp.esManto){S.tab="solicitudes";S.sol.subTab="cola_manto";cargarSolicitudes();}
    else{S.tab="produccion";}
    S.view="main";render();
  }else{S.loginError=true;render();}
}

  var actual=sol&&sol.clasificacion?String(sol.clasificacion):"";
  var p=parseClasificacion(actual);
  S.sol.editClasif={showing:true,tipo:p.tipo,subtipo:p.subtipo};render();
}
function editClasifClose(){S.sol.editClasif={showing:false,tipo:"",subtipo:""};render();}
function editClasifTipo(t){S.sol.editClasif.tipo=t;if(!tipoTieneSub(t))S.sol.editClasif.subtipo="";render();}
function editClasifSubtipo(t){S.sol.editClasif.subtipo=t;render();}
function directaOpen(){S.sol.directa={showing:true,maquina:"",tipo:"",subtipo:"",actividades:"",horas:""};render();}
function directaClose(){S.sol.directa={showing:false,maquina:"",tipo:"",subtipo:"",actividades:"",horas:""};render();}
function directaTipo(t){S.sol.directa.tipo=t;if(!tipoTieneSub(t))S.sol.directa.subtipo="";render();}
function directaSubtipo(t){S.sol.directa.subtipo=t;render();}

// ============================================================
// RENDER
// ============================================================

function render(){
  var app=document.getElementById("app");
  if(S.view==="loading"){app.innerHTML='<div class="spinner">Cargando catalogos...</div>';return;}
  if(S.view==="login"){app.innerHTML=buildLogin();bindLogin();return;}
  if(S.view==="done"){app.innerHTML=buildDone();bindDone();return;}
  if(S.view==="resumen"){app.innerHTML=buildResumen();bindResumen();return;}
  app.innerHTML=buildMain();bindMain();
}

function buildLogin(){
  return '<div style="max-width:400px;margin:0 auto;padding:3rem 1.5rem">'
    +'<div style="background:#000;border-radius:10px;padding:8px 14px;display:inline-block;margin-bottom:16px"><span style="color:#fff;font-weight:900;font-size:28px;letter-spacing:-1px">MK</span><span style="color:#1D9E75;font-weight:900;font-size:28px">M</span></div>'
    +'<p style="font-size:15px;color:#888;margin-bottom:40px">Reporte de produccion</p>'
    +'<label>Numero de empleado</label>'
    +'<input id="loginNum" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Ej. 264" style="font-size:28px;padding:14px 16px;letter-spacing:4px;margin-bottom:8px">'
    +(S.loginError?'<p class="error-msg">Numero no encontrado.</p>':"")
    +'<button class="send-btn" style="background:#1D9E75" id="loginBtn">Entrar</button></div>';
}
function bindLogin(){
  var inp=document.getElementById("loginNum"),btn=document.getElementById("loginBtn");
  inp.focus();
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin(inp.value);});
  btn.addEventListener("click",function(){doLogin(inp.value);});
}

function mkResumenCard(label,val,color){
  return '<div style="background:#fff;border-radius:12px;padding:12px;text-align:center;border:1px solid #eee"><p style="font-size:11px;color:#888;margin-bottom:4px">'+label+'</p><p style="font-size:28px;font-weight:700;color:'+color+'">'+val+'</p></div>';
}

// ============================================================
// RENDER RESUMEN (DUEÑO)
// ============================================================

function buildResumen(){
  // Dashboard del dueño (reemplaza el panel resumen viejo)
  return buildDashboard();
}

// ============================================================
// DASHBOARD DE EFICIENCIA POR MÁQUINA (v11)
// ============================================================

// Colores por rango de eficiencia
function _effColor(e){
  if(e>=100)return{bg:"#E6F1FB",fg:"#0C447C"};   // Azul (sobreproducción)
  if(e>=80) return{bg:"#E1F5EE",fg:"#0F6E56"};   // Verde
  if(e>=60) return{bg:"#FAEEDA",fg:"#854F0B"};   // Ámbar
  return       {bg:"#FCEBEB",fg:"#A32D2D"};      // Rojo
}

function buildDashboard(){
  var d=S.dashboard;
  var p=d.periodo;
  var labels={hoy:"Hoy",semana:"Esta semana",mes:"Este mes",custom:"Rango personalizado"};
  var periodoLabel=labels[p]||"Hoy";

  // --- Selector de periodo (4 opciones) ---
  var perBtn=function(per,txt){
    var act=p===per;
    return '<button data-dperiod="'+per+'" style="flex:1;padding:9px 4px;border:none;border-radius:8px;font-size:13px;font-weight:'+(act?'700':'500')+';cursor:pointer;background:'+(act?'#1D9E75':'#fff')+';color:'+(act?'#fff':'#555')+';box-shadow:'+(act?'none':'0 0 0 1px #e0e0e0')+'">'+txt+'</button>';
  };
  var selPeriodo='<div style="display:flex;gap:5px;margin-bottom:10px">'
    +perBtn('hoy','Hoy')+perBtn('semana','Semana')+perBtn('mes','Mes')+perBtn('custom','Rango')
    +'</div>';

  // --- Inputs de fecha para custom ---
  var rangoHtml='';
  if(p==="custom"){
    rangoHtml='<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:#666">'
      +'<span>Desde</span>'
      +'<input type="date" id="dashDesde" value="'+(d.desde||'')+'" style="padding:5px 8px;font-size:12px;border-radius:6px;border:1px solid #ddd;flex:1">'
      +'<span>Hasta</span>'
      +'<input type="date" id="dashHasta" value="'+(d.hasta||'')+'" style="padding:5px 8px;font-size:12px;border-radius:6px;border:1px solid #ddd;flex:1">'
      +'<button id="btnAplicarRango" style="padding:6px 12px;border:none;border-radius:6px;background:#1D9E75;color:#fff;font-size:12px;font-weight:600;cursor:pointer">Aplicar</button>'
      +'</div>';
  }

  // --- Botón de selector múltiple de máquinas ---
  var nMaqSel=(d.maquinas||[]).length;
  var maqBtnLabel=nMaqSel>0?("Máquinas: "+nMaqSel+" ▾"):"Máquinas: Todas ▾";
  var maqBtnStyle=nMaqSel>0
    ?'padding:7px 12px;font-size:12px;border-radius:8px;border:1px solid #1D9E75;background:#E1F5EE;color:#0F6E56;font-weight:600;cursor:pointer'
    :'padding:7px 12px;font-size:12px;border-radius:8px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer';
  var maqLimpiarBtn=nMaqSel>0
    ?'<button id="btnLimpiarMaqSel" style="padding:6px 10px;font-size:11px;border-radius:6px;border:none;background:#f5f5f3;color:#888;cursor:pointer" title="Limpiar selección">✕</button>'
    :'';
  var selMaq='<div style="display:flex;gap:6px;flex:1;min-width:0">'
    +'<button id="btnAbrirSelMaq" style="'+maqBtnStyle+';flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+maqBtnLabel+'</button>'
    +maqLimpiarBtn
    +'</div>';

  // --- Selector de área + turno + orden ---
  var areas=["all","Torno","Centro de Maquinado","Bosses","Rectificado Exterior","Rectificado Interior","Corte","Ensamble","Soldadura","Detallado","Avellanado","Roscado"];
  var areaOptions=areas.map(function(a){
    var lbl=a==="all"?"Todas las áreas":a;
    var sel=d.area===a?"selected":"";
    return '<option value="'+a+'" '+sel+'>'+lbl+'</option>';
  }).join("");
  // Si hay máquinas seleccionadas, el área se ignora — mostramos deshabilitado con feedback
  var areaDisabled=nMaqSel>0?"disabled":"";
  var areaBg=nMaqSel>0?"#f5f5f3":"#fff";
  var areaColor=nMaqSel>0?"#aaa":"#333";
  var areaTitle=nMaqSel>0?"Ignorado por selección de máquinas":"";
  var selArea='<select id="dashArea" '+areaDisabled+' title="'+areaTitle+'" style="padding:7px 10px;font-size:12px;border-radius:8px;border:1px solid #e0e0e0;background:'+areaBg+';color:'+areaColor+';flex:1;min-width:0">'+areaOptions+'</select>';

  var turBtn=function(t,txt){
    var act=d.turno===t;
    return '<button data-dturno="'+t+'" style="padding:6px 10px;border:none;border-radius:6px;font-size:11px;font-weight:'+(act?'700':'500')+';cursor:pointer;background:'+(act?'#185FA5':'#f5f5f3')+';color:'+(act?'#fff':'#555')+'">'+txt+'</button>';
  };
  var selTurno='<div style="display:flex;gap:4px;flex-shrink:0">'
    +turBtn('all','Todos')+turBtn('1ro','1ro')+turBtn('3ro','3ro')
    +'</div>';

  var filtroRow1='<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">'+selMaq+'</div>';
  var filtroRow2='<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">'+selArea+selTurno+'</div>';

  var ordBtn=function(o,txt){
    var act=d.orden===o;
    return '<button data-dord="'+o+'" style="padding:6px 10px;border:none;border-radius:6px;font-size:11px;font-weight:'+(act?'700':'500')+';cursor:pointer;background:'+(act?'#333':'#f5f5f3')+';color:'+(act?'#fff':'#555')+'">'+txt+'</button>';
  };
  var ordenRow='<div style="display:flex;gap:4px;margin-bottom:14px;justify-content:flex-end">'
    +ordBtn('eff-desc','Efic ↓')+ordBtn('eff-asc','Efic ↑')+ordBtn('pzas','Pzas ↓')
    +'</div>';

  var controles=selPeriodo+rangoHtml+filtroRow1+filtroRow2+ordenRow;

  if(d.loading){
    return wrapDashboard(controles+'<div style="text-align:center;padding:3rem;color:#888">Cargando dashboard...</div>',periodoLabel);
  }

  var data=d.data;
  if(!data||!data.ok){
    return wrapDashboard(controles+'<div style="text-align:center;padding:3rem;color:#E24B4A">Error al cargar datos</div>',periodoLabel);
  }

  // --- KPIs globales ---
  var kpis='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px">'
    +dashKpi("EFIC GLOBAL",(data.effGlobal||0)+"%","#1D9E75")
    +dashKpi("PIEZAS",(data.totalPiezas||0).toLocaleString("es-MX"),"#1D9E75")
    +dashKpi("MÁQUINAS",data.numMaquinas||0,"#555")
    +dashKpi("HRS DISP",(data.totalHrsDisp||0).toFixed(0)+"h","#555")
    +'</div>';

  // --- Grid de tarjetas por máquina ---
  var cards=(data.cards||[]).slice();
  if(d.orden==="eff-desc")cards.sort(function(a,b){return b.eff-a.eff;});
  else if(d.orden==="eff-asc")cards.sort(function(a,b){return a.eff-b.eff;});
  else cards.sort(function(a,b){return b.piezas-a.piezas;});

  var grid='';
  if(cards.length===0){
    grid='<div style="background:#f8fafc;border-radius:10px;padding:40px 20px;text-align:center;color:#888;font-size:13px">Sin actividad en el filtro seleccionado</div>';
  }else{
    grid='<div class="mkm-dash-grid">'+cards.map(dashMaqCard).join("")+'</div>';
  }

  // --- Modal (si hay máquina seleccionada) ---
  var modal="";
  if(d.maqModal&&d.maqModal.maquina){
    modal=buildMaquinaModal();
  }
  // --- Modal del selector de máquinas ---
  var selectorModal="";
  if(d.selectorMaqOpen){
    selectorModal=buildSelectorMaquinasModal();
  }

  return wrapDashboard(controles+kpis+grid,periodoLabel)+modal+selectorModal;
}

function wrapDashboard(content,periodoLabel){
  return'<div class="mkm-dash-wrap" style="padding:1rem 1.25rem 3rem;max-width:520px;margin:0 auto">'
    +'<div class="mkm-dash-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<div><span style="font-weight:700;font-size:20px;display:block">Dashboard</span>'
    +'<span style="font-size:12px;color:#888">Eficiencia · '+periodoLabel+'</span></div>'
    +'<div><button class="refresh-btn" id="btnRefreshDash" style="margin-right:8px">↻</button>'
    +'<button style="font-size:13px;color:#E24B4A;background:none;border:none;cursor:pointer;padding:8px" id="btnSalirRes">Salir</button></div></div>'
    +content
    +'</div>';
}

function dashKpi(label,valor,color){
  return'<div style="background:#fff;border-radius:8px;padding:10px 6px;text-align:center;border:1px solid #eee">'
    +'<p style="font-size:9px;color:#888;font-weight:600;margin-bottom:3px;letter-spacing:0.5px">'+label+'</p>'
    +'<p style="font-size:17px;font-weight:700;color:'+color+';line-height:1">'+valor+'</p></div>';
}

// Tarjeta individual por máquina
function dashMaqCard(c){
  // Caso especial: máquina sin actividad en el periodo
  if(c.sinActividad){
    return '<div class="mkm-mach-card mkm-mach-empty" data-mkm-maq="'+_esc(c.maquina)+'" style="background:#fafaf9;border-radius:12px;border:1px dashed #ddd;padding:14px 16px;margin-bottom:12px;cursor:pointer;opacity:0.7">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">'
      +'<div style="font-size:15px;font-weight:600;color:#666">'+_esc(c.maquina)+'</div>'
      +'<div style="font-size:11px;color:#aaa">Sin actividad</div>'
      +'</div>'
      +'<div style="font-size:11px;color:#aaa;margin-bottom:16px">'+_esc(c.area||"")+'</div>'
      +'<div style="text-align:center;padding:14px 0;border-radius:8px;background:#f5f5f3">'
      +'<div style="font-size:36px;font-weight:600;color:#bbb;line-height:1;letter-spacing:-1px">—</div>'
      +'<div style="font-size:9px;color:#999;margin-top:3px;letter-spacing:0.5px">SIN REPORTES EN EL PERIODO</div>'
      +'</div></div>';
  }

  var col=_effColor(c.eff);
  var total=c.totalHrs||0.001;
  var pP=(c.hProd/total*100);
  var pS=(c.hSet/total*100);
  var pO=(c.hOver/total*100);
  var pM=((c.hManto||0)/total*100);
  var pI=(c.hIdle/total*100);

  // Colores unificados por categoría
  var COL_PROD="#1D9E75", COL_SET="#888780", COL_OVER="#EF9F27", COL_MANTO="#D4544E", COL_IDLE="#F0997B";

  var bar='<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:#f5f5f3;margin-bottom:8px">'
    +(pP>0?'<div style="width:'+pP+'%;background:'+COL_PROD+'"></div>':'')
    +(pS>0?'<div style="width:'+pS+'%;background:'+COL_SET+'"></div>':'')
    +(pO>0?'<div style="width:'+pO+'%;background:'+COL_OVER+'"></div>':'')
    +(pM>0?'<div style="width:'+pM+'%;background:'+COL_MANTO+'"></div>':'')
    +(pI>0?'<div style="width:'+pI+'%;background:'+COL_IDLE+'"></div>':'')
    +'</div>';

  // Legend con horas + porcentaje al lado
  var legendRow=function(color,lbl,val,pct){
    return '<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<span style="display:flex;align-items:center;gap:5px;color:#666;font-size:11px"><span style="width:7px;height:7px;border-radius:2px;background:'+color+'"></span>'+lbl+'</span>'
      +'<span style="font-size:11px;color:#222"><span style="font-weight:600">'+val.toFixed(1)+'h</span> <span style="color:#888">('+Math.round(pct)+'%)</span></span></div>';
  };
  var legend='<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-bottom:12px">'
    +legendRow(COL_PROD,"Producción",c.hProd,pP)
    +legendRow(COL_SET,"Montaje",c.hSet,pS)
    +legendRow(COL_OVER,"Sobre-setup",c.hOver,pO)
    +legendRow(COL_MANTO,"Manto",c.hManto||0,pM)
    +legendRow(COL_IDLE,"Ocioso",c.hIdle,pI)
    +'</div>';

  var acts=(c.acts||[]).slice(0,5);
  var actsHtml='';
  if(acts.length===0){
    actsHtml='<p style="font-size:11px;color:#aaa;padding:4px 0">Sin producción registrada</p>';
  }else{
    actsHtml=acts.map(function(a){
      var horasCell=a.sinStd
        ? '<div style="color:#854F0B;text-align:right;line-height:1.3;font-size:10px">— h<br><span style="background:#FAEEDA;color:#854F0B;padding:1px 5px;border-radius:3px;font-weight:700;font-size:9px">SIN ESTÁNDAR</span></div>'
        : '<div style="color:#666;text-align:right;font-variant-numeric:tabular-nums;line-height:1.3">'+(a.pzas||0).toLocaleString("es-MX")+' pzs<br>'+(a.hrs||0).toFixed(2)+'h</div>';
      var pzasCell=a.sinStd
        ? '<div style="color:#666;font-size:11px;font-variant-numeric:tabular-nums">'+(a.pzas||0).toLocaleString("es-MX")+' pzs</div>'
        : '';
      return '<div style="display:grid;grid-template-columns:1fr auto;gap:6px;padding:3px 0;font-size:11px">'
        +'<div><div style="color:'+(a.sinStd?"#854F0B":"#222")+';font-weight:500">'+(a.respName||a.resp)+'</div>'
        +'<div style="color:#888;font-size:10px">'+a.np+' · op '+a.op+'</div>'
        +pzasCell+'</div>'
        +horasCell
        +'</div>';
    }).join("");
    if(c.acts.length>5){
      actsHtml+='<p style="font-size:10px;color:#999;text-align:center;padding:4px 0">+ '+(c.acts.length-5)+' más — toca para ver detalle</p>';
    }
  }

  // Turnos presentes (ej: "1ro · 3ro")
  var turnosStr=(c.turnosPresentes&&c.turnosPresentes.length)?c.turnosPresentes.join(" · "):c.turnos+" turno"+(c.turnos>1?'s':'');

  // Info adicional de disponibilidad si hay manto
  var infoDisp='';
  if((c.hManto||0)>0){
    infoDisp='<div style="font-size:10px;color:#888;margin-top:-4px;margin-bottom:6px">Base para eficiencia: '+(c.hDisponible||c.totalHrs).toFixed(1)+'h disponibles (9.5h × '+c.turnos+' turnos − '+c.hManto.toFixed(1)+'h manto)</div>';
  }

  return '<div class="mkm-mach-card" data-mkm-maq="'+_esc(c.maquina)+'" style="background:#fff;border-radius:12px;border:1px solid #eee;padding:14px 16px;margin-bottom:12px;cursor:pointer">'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">'
    +'<div style="font-size:15px;font-weight:600">'+_esc(c.maquina)+'</div>'
    +'<div style="font-size:11px;color:#888">'+_esc(turnosStr)+'</div>'
    +'</div>'
    +'<div style="font-size:11px;color:#888;margin-bottom:12px">'+_esc(c.area||"")+'</div>'
    +'<div style="text-align:center;padding:10px 0;margin-bottom:12px;border-radius:8px;background:'+col.bg+'">'
    +'<div style="font-size:36px;font-weight:600;color:'+col.fg+';line-height:1;letter-spacing:-1px">'+c.eff+'%</div>'
    +'<div style="font-size:9px;color:'+col.fg+';margin-top:3px;letter-spacing:0.5px">EFICIENCIA</div>'
    +'</div>'
    +infoDisp
    +'<p style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;font-weight:600">Distribución de '+c.totalHrs.toFixed(1)+'h</p>'
    +bar+legend
    +'<div style="border-top:1px solid #f0f0f0;padding-top:8px">'
    +'<p style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;font-weight:600">Actividad detallada</p>'
    +actsHtml
    +'</div></div>';
}

// Modal de máquina expandida con tendencia diaria
function buildMaquinaModal(){
  var mm=S.dashboard.maqModal;
  var body="";
  if(mm.loading){
    body='<div style="padding:3rem;text-align:center;color:#888">Cargando...</div>';
  }else if(!mm.data||!mm.data.ok){
    body='<div style="padding:3rem;text-align:center;color:#E24B4A">Error al cargar datos de máquina</div>';
  }else{
    var d=mm.data;
    var res=d.resumen||{};
    var col=_effColor(res.eff||0);

    // Header con eficiencia grande
    var header='<div style="text-align:center;padding:14px 0;margin-bottom:14px;border-radius:10px;background:'+col.bg+'">'
      +'<div style="font-size:44px;font-weight:600;color:'+col.fg+';line-height:1;letter-spacing:-1px">'+(res.eff||0)+'%</div>'
      +'<div style="font-size:11px;color:'+col.fg+';margin-top:5px;letter-spacing:0.5px">EFICIENCIA · '+res.turnos+' turno'+(res.turnos>1?'s':'')+' · '+(res.piezas||0).toLocaleString("es-MX")+' piezas</div>'
      +'</div>';

    // Gráfica de tendencia SVG
    var tend=d.tendencia||[];
    var chart="";
    if(tend.length>0){
      chart='<p style="font-size:12px;color:#666;font-weight:600;margin:16px 0 6px">Tendencia diaria de eficiencia</p>';
      chart+=_svgLineChart(tend,"eff","dia",240,120);
    }

    // Distribución total (incluye manto)
    var totHrs=res.totalHrs||0.001;
    var pP=(res.hProd/totHrs*100),pS=(res.hSet/totHrs*100),pO=(res.hOver/totHrs*100),pM=((res.hManto||0)/totHrs*100),pI=(res.hIdle/totHrs*100);
    var COL_PROD="#1D9E75", COL_SET="#888780", COL_OVER="#EF9F27", COL_MANTO="#D4544E", COL_IDLE="#F0997B";
    var distr='<p style="font-size:12px;color:#666;font-weight:600;margin:16px 0 6px">Distribución de '+totHrs.toFixed(1)+'h totales</p>'
      +'<div style="display:flex;height:12px;border-radius:6px;overflow:hidden;background:#f5f5f3;margin-bottom:10px">'
      +(pP>0?'<div style="width:'+pP+'%;background:'+COL_PROD+'"></div>':'')
      +(pS>0?'<div style="width:'+pS+'%;background:'+COL_SET+'"></div>':'')
      +(pO>0?'<div style="width:'+pO+'%;background:'+COL_OVER+'"></div>':'')
      +(pM>0?'<div style="width:'+pM+'%;background:'+COL_MANTO+'"></div>':'')
      +(pI>0?'<div style="width:'+pI+'%;background:'+COL_IDLE+'"></div>':'')
      +'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px">'

// SVG helper: gráfica de línea simple
function _svgLineChart(data,valKey,labelKey,w,h){
  if(!data||data.length===0)return'<p style="color:#aaa;font-size:12px">Sin datos</p>';
  var pad={top:12,right:8,bottom:24,left:28};
  var innerW=w-pad.left-pad.right;
  var innerH=h-pad.top-pad.bottom;
  var maxV=Math.max(100,Math.ceil(Math.max.apply(null,data.map(function(d){return d[valKey]||0;}))/10)*10);
  var pts=data.map(function(d,i){
    var x=pad.left+(data.length===1?innerW/2:i/(data.length-1)*innerW);
    var y=pad.top+innerH-((d[valKey]||0)/maxV)*innerH;
    return{x:x,y:y,d:d};
  });
  var polyline=pts.map(function(p){return p.x+","+p.y;}).join(" ");
  // Grid lines cada 25
  var gridLines="";
  for(var g=0;g<=maxV;g+=25){
    var y=pad.top+innerH-(g/maxV)*innerH;
    gridLines+='<line x1="'+pad.left+'" y1="'+y+'" x2="'+(w-pad.right)+'" y2="'+y+'" stroke="#eee" stroke-width="1"/>';
    gridLines+='<text x="'+(pad.left-4)+'" y="'+(y+3)+'" font-size="9" fill="#888" text-anchor="end">'+g+'</text>';
  }
  var line100='<line x1="'+pad.left+'" y1="'+(pad.top+innerH-(100/maxV)*innerH)+'" x2="'+(w-pad.right)+'" y2="'+(pad.top+innerH-(100/maxV)*innerH)+'" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3,3"/>';
  var dots=pts.map(function(p){
    var col=_effColor(p.d[valKey]||0);
    return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="'+col.fg+'"/>';
  }).join("");
  var labels=pts.map(function(p,i){
    if(data.length>7&&i%Math.ceil(data.length/7)!==0)return"";
    return '<text x="'+p.x+'" y="'+(h-8)+'" font-size="9" fill="#888" text-anchor="middle">'+p.d[labelKey]+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px;display:block;margin:0 auto">'
    +gridLines+line100
    +'<polyline points="'+polyline+'" fill="none" stroke="#1D9E75" stroke-width="2"/>'
    +dots+labels
    +'</svg>';
}

function _distrRow(color,lbl,val,pct){
  var pctStr=(pct!=null)?' <span style="color:#888;font-weight:400">('+Math.round(pct)+'%)</span>':'';

    +'<span style="display:flex;align-items:center;gap:6px;color:#666"><span style="width:8px;height:8px;border-radius:2px;background:'+color+'"></span>'+lbl+'</span>'

}

  if(esProd){

    html+='<div class="field"><label>Horas de mantenimiento</label><input type="number" inputmode="decimal" class="num-input" placeholder="0.0" id="edHorasManto" value="'+(ed.horasManto||"")+'" step="0.5"></div>';
  }

  html+='</div>';
  html+='<button class="send-btn" style="background:#1D9E75" id="btnGuardarEd"'+(S.sending?" disabled":"")+'>'+(S.sending?"Guardando...":"Guardar cambios")+'</button>';
  return html;
}

function bindEditando(){
  var bce=document.getElementById("btnCancelarEd");if(bce)bce.addEventListener("click",cancelarEdicion);
  var bge=document.getElementById("btnGuardarEd");
  if(bge)bge.addEventListener("click",function(){
    var ed=S.editando;
    var esProd=ed.tipo==="Producción"||ed.tipo==="Produccion";
    var esSetup=ed.tipo==="Setup",esManto=ed.tipo==="Mantenimiento";
    var npStr=String(ed.noParte||"");
    var esOtro=npStr.indexOf("Otro")===0;
    var ot=document.getElementById("edOT");if(ot)ed.ordenTrabajo=ot.value;
    if(esProd){
      if(esOtro){
        var dOtro=document.getElementById("edDescOtro");
        var descTxt=dOtro?dOtro.value:"";
        ed.noParte="Otro"+(descTxt?" - "+descTxt:"");
        var hO=document.getElementById("edHorasOtro");
        if(hO){ed.horasSetup=hO.value;ed.piezas="";}
      }else{
        var pz=document.getElementById("edPiezas");if(pz){ed.piezas=pz.value;ed.horasSetup="";}
      }
    }
    if(esSetup){
      var hs=document.getElementById("edHorasSetup");if(hs)ed.horasSetup=hs.value;
    }
    if(esManto){
      var hm=document.getElementById("edHorasManto");if(hm)ed.horasManto=hm.value;
      var ds=document.getElementById("edDescManto");if(ds)ed.descripcion=ds.value;
    }
    guardarEdicion();
  });
  document.querySelectorAll("[data-maq]").forEach(function(el){el.addEventListener("click",function(){setMaq(el.dataset.ns,el.dataset.maq);});});
  document.querySelectorAll("[data-op]").forEach(function(el){el.addEventListener("click",function(){setOp(el.dataset.ns,el.dataset.op);});});
  document.querySelectorAll("[data-mantoedit]").forEach(function(el){el.addEventListener("click",function(){selMantoEdit(el.dataset.mantoedit);});});
  document.querySelectorAll("[data-parte]").forEach(function(el){el.addEventListener("click",function(){selParte(el.dataset.ns,el.dataset.parte);});});
  document.querySelectorAll("[data-search]").forEach(function(el){
    el.addEventListener("input",function(){
      var ns=el.dataset.search,q=el.value;
      if(ns==="edit"){S.editando.q=q;S.editando.noParte="";S.editando.operacion="";}
      render();
    });
  });
}

function buildMiTurno(){
  var mt=S.miturno,rows=mt.data||[];
  if(S.editando){return buildEditando();}
  var totalPiezas=0,totalSetup=0,totalManto=0;
  rows.forEach(function(r){totalPiezas+=parseInt(r.piezas)||0;totalSetup+=parseFloat(r.horasSetup)||0;totalManto+=parseFloat(r.horasManto)||0;});
  var filas=rows.length===0?'<p style="color:#888;font-size:14px;text-align:center;padding:1rem">Sin registros para este turno</p>'
    :rows.map(function(r,idx){
      var esProd=r.tipo==="Produccion"||r.tipo==="Producción",esSetup=r.tipo==="Setup";
      var color=esProd?"#1D9E75":esSetup?"#185FA5":"#BA7517";
      var valor=esProd?(r.piezas||"0")+" pzs":esSetup?(r.horasSetup||"0")+" hrs":(r.horasManto||"0")+" hrs";
      var tsDate=parsearTimestamp(r.timestamp),ahora=new Date();
      var puedeEditar=tsDate&&((ahora-tsDate)/3600000<=72);
      return'<div style="padding:10px 0;border-bottom:1px solid #f0f0f0">'
        +'<div style="display:flex;justify-content:space-between;align-items:center">'

        +'<div style="text-align:right"><span style="font-size:16px;font-weight:700;color:'+color+'">'+valor+'</span><span style="display:block;font-size:11px;font-weight:600;color:'+color+'">'+r.tipo+'</span></div></div>'
        +(puedeEditar?'<button class="edit-btn" data-editidx="'+idx+'">Editar</button><button class="borrar-btn" data-borraridx="'+idx+'">Borrar</button>':"")
        +'</div>';
    }).join("");
  return'<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<input type="text" id="mtFecha" value="'+mt.fecha+'" placeholder="dd/mm/yyyy" style="flex:1;font-size:15px;padding:8px 10px;min-width:130px;max-width:140px">'
    +'<button class="turno-btn'+(mt.turno==="1ro"?" active":"")+'\" id="mt1">1ro</button>'
    +'<button class="turno-btn'+(mt.turno==="3ro"?" active":"")+'\" id="mt3">3ro</button>'
    +'<button style="padding:8px 16px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer" id="mtBuscar">Buscar</button>'
    +'<button class="refresh-btn" id="mtRefresh">↻</button></div></div>'
    +(mt.loading?'<div style="text-align:center;padding:2rem;color:#888">Cargando...</div>'
      :'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">'
        +mkResumenCard("PIEZAS",totalPiezas,"#1D9E75")
        +mkResumenCard("HRS SETUP",totalSetup.toFixed(1),"#185FA5")
        +mkResumenCard("HRS MANTO",totalManto.toFixed(1),"#BA7517")
        +'</div><div class="card">'+filas+'</div>');

function buildMaquinas(ns){
  var sel=ns==="prod"?S.prod.maquina:ns==="setup"?S.setup.maquina:ns==="manto"?S.manto.maquina:ns==="solcrear"?S.sol.crear.maquina:ns==="directa"?S.sol.directa.maquina:"";
  var html="";
  // Para manto, solcrear y directa usamos TODAS las máquinas (incluye secundarias)
  var areas=(ns==="manto"||ns==="solcrear"||ns==="directa")?areasTodas():areasPrincipales();
  areas.forEach(function(a){
    var cols=Math.min(a.maquinas.length,2);
    html+='<p class="area-label">'+a.area+'</p><div class="btn-grid" style="grid-template-columns:repeat('+cols+',1fr)">';
    a.maquinas.forEach(function(m){html+='<button class="big-btn'+(sel===m?" active":"")+'\" data-ns="'+ns+'" data-maq="'+m+'">'+m+'</button>';});
    html+='</div>';
  });
  return html;
}
function buildBuscador(ns,q,noParte){
  var PART_LIST=["Otro"].concat(Object.keys(CAT.partes).sort());
  var ql=q.toLowerCase(),lista=q.length>1?PART_LIST.filter(function(p){return p.toLowerCase().indexOf(ql)>=0;}).slice(0,15):[];
  var sel=noParte?'<div class="selected-parte">&#10003; '+noParte+'</div>':"",res="";
  if(lista.length&&!noParte){res='<div class="search-results">';lista.forEach(function(p){res+='<button class="search-result-btn" data-ns="'+ns+'" data-parte="'+p+'">'+p+'</button>';});res+='</div>';}
  return'<div class="field"><label>No. de parte</label><input type="text" inputmode="text" placeholder="Escribe para buscar..." value="'+q+'" data-search="'+ns+'" autocomplete="off">'+sel+res+'</div>';
}
function buildOpBtns(ops,selected,maq,ns){
  if(!ops.length)return"";
  var html='<div class="field"><label>Operacion</label><div class="btn-grid" style="grid-template-columns:repeat(2,1fr)">';
  ops.forEach(function(o){html+='<button class="big-btn'+(selected===o?" active":"")+'\" style="font-size:14px" data-ns="'+ns+'" data-op="'+o+'">'+opLabel(o,maq)+'</button>';});
  return html+'</div></div>';
}
function buildProd(){
  var p=S.prod,html='<div class="section"><label>Maquina</label>'+buildMaquinas("prod")+'</div>';
  p.partidas.forEach(function(pt,i){
    var esOtro=pt.noParte==="Otro",ops=esOtro?[]:getOps(pt.noParte,p.maquina),opsOtro=esOtro?getOpsParaMaquina(p.maquina):[];
    var tc=(!esOtro&&pt.noParte&&pt.operacion&&CAT.partes[pt.noParte])?CAT.partes[pt.noParte][pt.operacion]:null;
    var area=getMaqArea(p.maquina);
    html+='<div class="card"><div class="partida-header"><span style="font-size:16px;font-weight:600">Partida '+(i+1)+'</span>'+(i>0?'<button class="del-btn" data-del="'+i+'">Eliminar</button>':"")+'</div>'
      +buildBuscador("prod_"+i,pt.q||"",pt.noParte)
      +(esOtro?'<div class="field"><label>Que se realizo?</label><textarea placeholder="Describe brevemente..." data-desc="'+i+'" style="font-size:16px;min-height:80px">'+(pt.desc||"")+'</textarea></div>':"")
      +'<div class="field"><label>Orden de trabajo</label><input type="tel" inputmode="numeric" pattern="[0-9]*" class="ot-input" placeholder="550214" data-ot="'+i+'" value="'+(pt.ot||"")+'"></div>'
      +(!esOtro&&pt.noParte&&ops.length?buildOpBtns(ops,pt.operacion,p.maquina,"prod_"+i):"")
      +(esOtro&&opsOtro.length?'<div class="field"><label>Operacion</label><div class="btn-grid" style="grid-template-columns:repeat(2,1fr)">'+opsOtro.map(function(o){return'<button class="big-btn'+(pt.operacion===o?" active":"")+'\" style="font-size:14px" data-ns="prod_'+i+'" data-op="'+o+'">'+opLabel(o,p.maquina)+'</button>';}).join("")+'</div></div>':"")
      +(area==="torno"&&pt.operacion==="100a"?'<div class="torno-note">Rectificado Interior en Torno - reportado como 100s</div>':"")
      +(tc?'<div class="tc-note">Tiempo de ciclo: <strong>'+tc+' min</strong></div>':"")
      +'<div class="field"><label>Piezas</label><input type="number" inputmode="numeric" class="num-input" placeholder="0" data-piezas="'+i+'" value="'+pt.piezas+'"></div>'
      +(esOtro?'<div class="field"><label>Horas</label><input type="number" inputmode="decimal" class="num-input" placeholder="0.0" data-horas="'+i+'" value="'+(pt.horas||"")+'" step="0.5"></div>':"")
      +'</div>';
  });
  html+='<button class="add-btn" id="btnAddPartida">+ Agregar otra partida</button><button class="send-btn" style="background:#1D9E75" id="sendProd"'+(S.sending?" disabled":"")+'>'+(S.sending?"Enviando...":"Enviar reporte")+'</button>';
  return html;
}
function buildSetup(){
  var s=S.setup,ops=(s.noParte&&s.noParte!=="Otro"&&CAT.partes[s.noParte])?Object.keys(CAT.partes[s.noParte]):[];
  return'<div class="section"><label>Maquina</label>'+buildMaquinas("setup")+'</div><div class="card">'+buildBuscador("setup",s.q||"",s.noParte)

function buildManto(){

function estadoPillClass(estado){
  var e=String(estado||"").toLowerCase();
  if(e==="abierta")return"estado-abierta";
  if(e==="en proceso")return"estado-proceso";
  if(e==="cierre propuesto")return"estado-cierre";
  if(e==="aceptada")return"estado-aceptada";
  if(e==="descartada")return"estado-descartada";
  return"estado-proceso";
}

function buildSolicitudes(){
  if(S.sol.crear.showing)return buildSolCrear();
  if(S.sol.directa.showing)return buildActividadDirectaForm();
  if(S.sol.viendo&&(S.sol.detalleLoading||S.sol.detalle))return buildSolDetalle();
  return buildSolLista();
}

function buildSolLista(){
  var emp=S.empleado,sub=S.sol.subTab;
  // Sub-tabs según rol
  var subTabs=[];
  if(emp.puedeSolicitar||emp.esManto)subTabs.push({id:"mias",label:"Mis solicitudes"});
  if(emp.puedeAceptar)subTabs.push({id:"por_aceptar",label:"Por aceptar"});
  if(emp.esManto)subTabs.push({id:"cola_manto",label:"Cola manto"});
  subTabs.push({id:"todas",label:"Todas activas"});
  subTabs.push({id:"cerradas",label:"Cerradas"});

  // Validar que subTab actual exista
  var existe=subTabs.some(function(t){return t.id===sub;});
  if(!existe){sub=subTabs[0].id;S.sol.subTab=sub;}

  var subTabsHtml='<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:6px">'+subTabs.map(function(t){
    return'<button data-soltab="'+t.id+'" style="padding:12px 18px;border-radius:20px;border:1px solid '+(sub===t.id?"#1D9E75":"#ccc")+';background:'+(sub===t.id?"#1D9E75":"#fff")+';color:'+(sub===t.id?"#fff":"#333")+';font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px">'+t.label+'</button>';
  }).join("")+'</div>';

  // Botón nueva solicitud (solo si puede solicitar o es manto)
  var btnNueva="";
  if(emp.puedeSolicitar||emp.esManto){
    btnNueva='<button class="send-btn" style="background:#1D9E75;margin-bottom:14px" id="btnSolNueva">+ Nueva solicitud</button>';
  }

  // Botón registrar actividad directa (solo manto y dueño)
  var btnDirecta="";
  if(emp.esManto||S.esDueno){
    btnDirecta='<button class="send-btn" style="background:#BA7517;margin-bottom:14px" id="btnSolDirecta">+ Registrar actividad directa</button>';
  }

  var refreshBtn='<button class="refresh-btn" id="btnSolRefresh" style="margin-left:8px">↻</button>';

  // Filtrado en cliente según subTab (el servidor ya filtra básico, aquí afinamos)
  var rows=S.sol.data||[];
  var filtrado=rows.slice();
  var avisoLimite="";
  if(sub==="por_aceptar"){
    filtrado=filtrado.filter(function(s){return s.estado==="Cierre propuesto";});
  }else if(sub==="cola_manto"){
    // Cola manto: solo solicitudes pendientes de trabajo, nunca directas (nacen cerradas)
    filtrado=filtrado.filter(function(s){return (s.estado==="Abierta"||s.estado==="En proceso")&&s.origen!=="Directa";});
  }else if(sub==="mias"){
    // Server ya filtró por usuario, pero puede traer cerradas — quitamos
    filtrado=filtrado.filter(function(s){return s.estado!=="Aceptada"&&s.estado!=="Descartada";});
  }else if(sub==="todas"){
    filtrado=filtrado.filter(function(s){return s.estado!=="Aceptada"&&s.estado!=="Descartada";});
  }else if(sub==="cerradas"){
    // Filtro defensivo: solo estados cerrados
    filtrado=filtrado.filter(function(s){return s.estado==="Aceptada"||s.estado==="Descartada";});
    // Aviso cuando llegó al límite
    if(filtrado.length>=10){
      avisoLimite='<div style="font-size:12px;color:#888;padding:8px 12px;background:#f0f0f0;border-radius:8px;margin-bottom:10px;text-align:center">Mostrando las 10 más recientes. Consulta el Sheet para histórico completo.</div>';
    }
  }

  var listaHtml=S.sol.loading?'<div style="text-align:center;padding:2rem;color:#888">Cargando...</div>'
    :filtrado.length===0?'<div class="card" style="text-align:center;color:#888">Sin solicitudes</div>'
    :filtrado.map(function(s){
      var cls=s.prioridad==="Urgente"?"urgente":"normal";
      var estClass=estadoPillClass(s.estado);
      var esDirecta=s.origen==="Directa";
      var badgeDirecta=esDirecta?'<span style="font-size:10px;font-weight:700;color:#fff;background:#BA7517;padding:2px 8px;border-radius:8px;margin-right:6px">DIRECTA</span>':"";
      return'<div class="card sol-card '+(esDirecta?"cerrada":cls)+'" data-solver="'+s.id+'" style="cursor:pointer">'
        +'<div class="sol-header">'
        +'<div style="flex:1">'+badgeDirecta+'<span class="sol-id">'+s.id+'</span>'
        +'<div style="font-size:15px;font-weight:600;margin-top:2px">'+s.maquina+'</div>'
        +'<div style="font-size:12px;color:#888;margin-top:2px">'+s.fecha+' · '+s.turno+' · '+(String(s.solicitante||"").split(" - ")[0])+'</div></div>'
        +'<div style="text-align:right">'
        +(esDirecta?'':'<span class="pill estado-'+cls+'" style="background:'+(s.prioridad==="Urgente"?"#FBE5E5":"#E6F1FB")+';color:'+(s.prioridad==="Urgente"?"#E24B4A":"#185FA5")+'">'+s.prioridad+'</span><br>')
        +'<span class="estado-pill '+estClass+'">'+s.estado+'</span></div></div>'
        +'<div style="font-size:13px;color:#555;margin-top:8px">'+(s.descripcion||"").substring(0,100)+(String(s.descripcion||"").length>100?"...":"")+'</div>'
        +'</div>';
    }).join("");

  return'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    +'<span style="font-size:16px;font-weight:600">Solicitudes de mantenimiento</span>'
    +refreshBtn+'</div>'
    +subTabsHtml+btnNueva+btnDirecta+avisoLimite+listaHtml;
}

function buildSolCrear(){

function buildSolDetalle(){
  if(S.sol.detalleLoading)return'<div class="spinner">Cargando detalle...</div>';
  var d=S.sol.detalle;if(!d)return'<div class="card">Sin detalle</div>';
  var s=d.solicitud,avances=d.avances||[];
  var emp=S.empleado;

  // Permisos sobre esta solicitud
  var soySolicitante=String(s.solicitante||"").indexOf(emp.numero)>=0;
  var puedeAceptar=emp.puedeAceptar||S.esDueno;
  // Candado: último técnico que cerró no puede aceptarla
  var ultimoTecCierre="";
  for(var i=0;i<avances.length;i++){
    if(avances[i].esCierre==="Sí")ultimoTecCierre=String(avances[i].tecnico||"").split(" - ")[0];
  }
  var soyElQueCerro=ultimoTecCierre===emp.numero;
  var puedeAceptarEsta=puedeAceptar&&!soyElQueCerro&&s.estado==="Cierre propuesto";
  var puedeRechazarEsta=puedeAceptar&&!soyElQueCerro&&s.estado==="Cierre propuesto";
  var puedeAvanzar=emp.esManto&&s.estado!=="Aceptada"&&s.estado!=="Descartada";
  var puedeDescartar=emp.esManto&&(s.estado==="Abierta"||s.estado==="En proceso")&&avances.length===0;
  var estaCerrada=s.estado==="Aceptada"||s.estado==="Descartada";

  var puedeEditarClasif=(emp.esManto||S.esDueno)&&s.estado!=="Descartada";
  var clasifActual=s.clasificacion?String(s.clasificacion):"";
  // FIX #1: destacar visualmente cuando falta clasificación y ya está en Cierre propuesto
  var faltaClasifCritica=!clasifActual&&s.estado==="Cierre propuesto";
  var bgClasif=clasifActual?"#E1F5EE":(faltaClasifCritica?"#FBE5E5":"#FAEEDA");
  var colorClasif=clasifActual?"#1D9E75":(faltaClasifCritica?"#E24B4A":"#BA7517");
  var borderClasif=faltaClasifCritica?"border:2px solid #E24B4A;":"";
  var textoClasif=clasifActual||(faltaClasifCritica?"⚠ Falta asignar clasificación":"Sin asignar");
  var clasifBox='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;background:'+bgClasif+';border-radius:10px;'+borderClasif+'">'
    +'<div><span style="font-size:12px;color:#666">Clasificación</span><br><strong style="font-size:14px;color:'+colorClasif+'">'+textoClasif+'</strong></div>'
    +(puedeEditarClasif?'<button style="font-size:12px;color:'+(faltaClasifCritica?"#E24B4A":"#185FA5")+';background:none;border:1px solid '+(faltaClasifCritica?"#E24B4A":"#185FA5")+';border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:'+(faltaClasifCritica?"700":"400")+'" id="btnEditClasif">'+(clasifActual?"Editar":"Asignar")+'</button>':'')
    +'</div>';

  var infoSol='<div class="card">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'
    +'<div><div class="sol-id">'+s.id+'</div>'
    +'<div style="font-size:17px;font-weight:700;margin-top:4px">'+s.maquina+'</div></div>'
    +'<div style="text-align:right"><span class="pill" style="background:'+(s.prioridad==="Urgente"?"#FBE5E5":"#E6F1FB")+';color:'+(s.prioridad==="Urgente"?"#E24B4A":"#185FA5")+'">'+s.prioridad+'</span>'
    +'<br><span class="estado-pill '+estadoPillClass(s.estado)+'" style="margin-top:4px;display:inline-block">'+s.estado+'</span></div></div>'
    +'<div style="font-size:13px;color:#666;margin-bottom:6px">Abierta: '+s.timestamp+'</div>'
    +'<div style="font-size:13px;color:#666;margin-bottom:6px">Solicitante: '+s.solicitante+'</div>'
    +(s.maquinaParada?'<div style="font-size:13px;color:#E24B4A;font-weight:600;margin-bottom:6px">⚠ Maquina parada: '+s.maquinaParada+'</div>':"")
    +'<div style="font-size:14px;margin-top:10px;padding:10px;background:#f9f9f7;border-radius:10px">'+s.descripcion+'</div>'
    +clasifBox
    +(s.motivoRechazo?'<div style="font-size:13px;color:#E24B4A;margin-top:8px">Rechazo previo: '+s.motivoRechazo+'</div>':"")
    +(s.tsAceptacion?'<div style="font-size:12px;color:#888;margin-top:10px">Cerrada: '+s.tsAceptacion+' por '+(s.aceptadoPor||"")+'</div>':"")
    +(s.tmi?'<div style="font-size:13px;margin-top:8px"><strong>TMI:</strong> '+s.tmi+' hrs'+(s.tmpAuto?' · <strong>TMP_Auto:</strong> '+s.tmpAuto+' hrs':"")+'</div>':"")
    +'</div>';

  var avancesHtml='<div class="card"><p style="font-weight:600;font-size:14px;margin-bottom:10px">Avances ('+avances.length+')</p>'
    +(avances.length===0?'<p style="color:#888;font-size:13px">Sin avances aún</p>':avances.map(function(a){
      var esDesc=a.esDescarte==="Sí",esC=a.esCierre==="Sí";
      return'<div class="avance-item">'
        +'<div class="avance-header"><span>'+a.timestamp+' · '+a.turno+'</span><span>'+(a.tecnico||"").split(" - ")[0]+'</span></div>'
        +(esDesc?'<div style="font-size:12px;color:#888;font-weight:600">DESCARTE</div>':"")
        +(esC?'<div style="font-size:12px;color:#7C3AED;font-weight:600">CIERRE PROPUESTO</div>':"")
        +'<div style="font-size:14px;margin:4px 0">'+(a.actividades||"")+'</div>'
        +(a.horas?'<div style="font-size:12px;color:#666">'+a.horas+' hrs</div>':"")
        +(esDesc&&a.motivoDescarte?'<div style="font-size:12px;color:#888;margin-top:4px">Motivo: '+a.motivoDescarte+'</div>':"")
        +'</div>';
    }).join(""))+'</div>';

  // Formularios de acción
  var accionesHtml='';
  if(S.sol.avance.showing)accionesHtml=buildAvanceForm();
  else if(S.sol.descartar.showing)accionesHtml=buildDescartarForm();
  else if(S.sol.rechazar.showing)accionesHtml=buildRechazarForm();
  else if(S.sol.editClasif.showing)accionesHtml=buildEditClasifForm();
  else if(!estaCerrada){
    var btns='';
    if(puedeAvanzar)btns+='<button class="send-btn" style="background:#1D9E75" id="btnSolAvance">+ Nuevo avance</button>';
    if(puedeAceptarEsta)btns+='<button class="btn-accept" style="width:100%;padding:14px;margin-top:8px;font-size:16px" id="btnSolAcept">✓ Aceptar cierre</button>';
    if(puedeRechazarEsta)btns+='<button class="btn-reject" style="width:100%;padding:14px;margin-top:8px;font-size:16px" id="btnSolRechaz">✗ Rechazar cierre</button>';
    if(puedeDescartar)btns+='<button class="btn-discard" style="width:100%;padding:14px;margin-top:8px;font-size:16px" id="btnSolDesc">Descartar solicitud</button>';
    if(S.esDueno&&s.estado==="Cierre propuesto")btns+='<button class="btn-discard" style="width:100%;padding:14px;margin-top:8px;font-size:16px;color:#BA7517;border-color:#BA7517" id="btnSolForzar">Forzar cierre (dueño)</button>';
    if(soyElQueCerro&&s.estado==="Cierre propuesto")btns+='<p style="font-size:12px;color:#BA7517;text-align:center;margin-top:10px;padding:10px;background:#FAEEDA;border-radius:10px">Tú cerraste esta solicitud. Debe aceptarla otra persona con permisos.</p>';
    accionesHtml=btns;
  }

  return'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
    +'<button style="font-size:13px;color:#185FA5;background:none;border:none;cursor:pointer;padding:6px" id="btnSolVolver">← Volver</button>'
    +'<button class="refresh-btn" id="btnSolDetRefresh">↻</button></div>'
    +infoSol+avancesHtml+accionesHtml;
}

function buildActividadDirectaForm(){

  var btns=tiposMantoPrincipales().map(function(t){return'<button class="big-btn'+(d.tipo===t?" active":"")+'\" data-dtipo="'+t+'">'+t+'</button>';}).join("");

    subBox='<div class="sub-cat-box"><label>Subcategoria de '+d.tipo+'</label><div class="btn-grid" style="grid-template-columns:repeat(2,1fr)">'+sbtns+'</div></div>';
  }
  return'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
    +'<span style="font-weight:600;font-size:16px">Registrar actividad directa</span>'
    +'<button style="font-size:13px;color:#888;background:none;border:none;cursor:pointer" id="btnDirectaCerrar">Cancelar</button></div>'
    +'<p style="font-size:13px;color:#666;margin-bottom:10px">Registra directamente un trabajo de mantenimiento sin pasar por una solicitud formal. Queda cerrada automáticamente.</p>'
    +'<div class="section"><label>Máquina</label>'+buildMaquinas("directa")+'</div>'
    +'<div class="field"><label>Clasificación</label><div class="btn-grid" style="grid-template-columns:repeat(2,1fr)">'+btns+'</div>'+subBox+'</div>'
    +'<div class="field"><label>Actividades realizadas</label><textarea id="dirActividades" placeholder="Describe qué se hizo en la máquina...">'+d.actividades+'</textarea></div>'
    +'<div class="field"><label>Horas invertidas</label><input type="number" inputmode="decimal" class="num-input" placeholder="0.0" id="dirHoras" value="'+d.horas+'" step="0.5"></div>'
    +'</div>'
    +'<button class="send-btn" style="background:#BA7517" id="btnDirectaEnviar"'+(S.sending?" disabled":"")+'>'+(S.sending?"Registrando...":"Registrar actividad")+'</button>';
}

// ============================================================
// BINDINGS
// ============================================================

  var bs=document.getElementById("btnSalir");if(bs)bs.addEventListener("click",doSalir);

  var ap=document.getElementById("btnAddPartida");if(ap)ap.addEventListener("click",addPartida);

  // MANTO
  var sm=document.getElementById("sendManto");if(sm)sm.addEventListener("click",sendManto);
  var md=document.getElementById("mantoDesc");if(md)md.addEventListener("input",function(){S.manto.descripcion=md.value;});
  var mh=document.getElementById("mantoHoras");if(mh)mh.addEventListener("input",function(){S.manto.horas=mh.value;});
  document.querySelectorAll("[data-manto]").forEach(function(el){el.addEventListener("click",function(){selManto(el.dataset.manto);});});
  document.querySelectorAll("[data-mantosub]").forEach(function(el){el.addEventListener("click",function(){selMantoSub(el.dataset.mantosub);});});

  // MI TURNO
  var mt1=document.getElementById("mt1");if(mt1)mt1.addEventListener("click",function(){S.miturno.turno="1ro";render();});
  var mt3=document.getElementById("mt3");if(mt3)mt3.addEventListener("click",function(){S.miturno.turno="3ro";render();});
  var mtb=document.getElementById("mtBuscar");if(mtb)mtb.addEventListener("click",function(){var f=document.getElementById("mtFecha");if(f)S.miturno.fecha=f.value;cargarMiTurno();});
  var mtf=document.getElementById("mtFecha");if(mtf)mtf.addEventListener("change",function(e){S.miturno.fecha=e.target.value;});
  var mtr=document.getElementById("mtRefresh");if(mtr)mtr.addEventListener("click",cargarMiTurno);
  document.querySelectorAll("[data-editidx]").forEach(function(el){el.addEventListener("click",function(){editarRegistro(S.miturno.data,parseInt(el.dataset.editidx));});});
  document.querySelectorAll("[data-borraridx]").forEach(function(el){el.addEventListener("click",function(){borrarRegistro(S.miturno.data,parseInt(el.dataset.borraridx));});});

  // EDITANDO
  if(S.editando)bindEditando();

  // SOLICITUDES
  var srf=document.getElementById("btnSolRefresh");if(srf)srf.addEventListener("click",cargarSolicitudes);
  var sdr=document.getElementById("btnSolDetRefresh");if(sdr)sdr.addEventListener("click",function(){cargarDetalleSolicitud(S.sol.viendo);});
  var sn=document.getElementById("btnSolNueva");if(sn)sn.addEventListener("click",solCrearOpen);
  var sc=document.getElementById("btnSolCerrar");if(sc)sc.addEventListener("click",solCrearClose);
  var se=document.getElementById("btnSolEnviar");if(se)se.addEventListener("click",sendCrearSolicitud);
  var sdv=document.getElementById("btnSolVolver");if(sdv)sdv.addEventListener("click",solVolver);
  var savb=document.getElementById("btnSolAvance");if(savb)savb.addEventListener("click",avanceOpen);
  var sacb=document.getElementById("btnSolAcept");if(sacb)sacb.addEventListener("click",sendAceptarSolicitud);
  var srcb=document.getElementById("btnSolRechaz");if(srcb)srcb.addEventListener("click",rechazarOpen);
  var sdcb=document.getElementById("btnSolDesc");if(sdcb)sdcb.addEventListener("click",descartarOpen);
  var sfcb=document.getElementById("btnSolForzar");if(sfcb)sfcb.addEventListener("click",sendForzarCierre);
  var sdesc=document.getElementById("solDesc");if(sdesc)sdesc.addEventListener("input",function(e){S.sol.crear.descripcion=e.target.value;});

  document.querySelectorAll("[data-soltab]").forEach(function(el){el.addEventListener("click",function(){setSolTab(el.dataset.soltab);});});
  document.querySelectorAll("[data-solver]").forEach(function(el){el.addEventListener("click",function(){solVer(el.dataset.solver);});});
  document.querySelectorAll("[data-prio]").forEach(function(el){el.addEventListener("click",function(){solCrearPrioridad(el.dataset.prio);});});
  document.querySelectorAll("[data-parada]").forEach(function(el){el.addEventListener("click",function(){solCrearParada(el.dataset.parada);});});

  // AVANCE
  var avc=document.getElementById("btnAvanceCerrar");if(avc)avc.addEventListener("click",avanceClose);
  var ave=document.getElementById("btnAvanceEnviar");if(ave)ave.addEventListener("click",sendCrearAvance);
  var avAct=document.getElementById("avActividades");if(avAct)avAct.addEventListener("input",function(e){S.sol.avance.actividades=e.target.value;});
  var avHor=document.getElementById("avHoras");if(avHor)avHor.addEventListener("input",function(e){S.sol.avance.horas=e.target.value;});
  var avCie=document.getElementById("avEsCierre");if(avCie)avCie.addEventListener("change",function(){avanceToggleCierre();});
  document.querySelectorAll("[data-avtipo]").forEach(function(el){el.addEventListener("click",function(){avanceTipo(el.dataset.avtipo);});});
  document.querySelectorAll("[data-avsub]").forEach(function(el){el.addEventListener("click",function(){avanceSubtipo(el.dataset.avsub);});});

  // DESCARTAR
  var dcc=document.getElementById("btnDescCerrar");if(dcc)dcc.addEventListener("click",descartarClose);
  var dce=document.getElementById("btnDescEnviar");if(dce)dce.addEventListener("click",sendDescartarSolicitud);
  var dcm=document.getElementById("descMotivo");if(dcm)dcm.addEventListener("input",function(e){S.sol.descartar.motivo=e.target.value;});

  // RECHAZAR
  var rcc=document.getElementById("btnRechCerrar");if(rcc)rcc.addEventListener("click",rechazarClose);
  var rce=document.getElementById("btnRechEnviar");if(rce)rce.addEventListener("click",sendRechazarSolicitud);
  var rcm=document.getElementById("rechMotivo");if(rcm)rcm.addEventListener("input",function(e){S.sol.rechazar.motivo=e.target.value;});

  // EDITAR CLASIFICACION
  var eco=document.getElementById("btnEditClasif");if(eco)eco.addEventListener("click",editClasifOpen);
  var ecc=document.getElementById("btnEditClasifCerrar");if(ecc)ecc.addEventListener("click",editClasifClose);
  var ece=document.getElementById("btnEditClasifEnviar");if(ece)ece.addEventListener("click",sendEditarClasificacion);
  document.querySelectorAll("[data-ectipo]").forEach(function(el){el.addEventListener("click",function(){editClasifTipo(el.dataset.ectipo);});});
  document.querySelectorAll("[data-ecsub]").forEach(function(el){el.addEventListener("click",function(){editClasifSubtipo(el.dataset.ecsub);});});

  // ACTIVIDAD DIRECTA
  var dio=document.getElementById("btnSolDirecta");if(dio)dio.addEventListener("click",directaOpen);
  var dic=document.getElementById("btnDirectaCerrar");if(dic)dic.addEventListener("click",directaClose);
  var die=document.getElementById("btnDirectaEnviar");if(die)die.addEventListener("click",sendCrearActividadDirecta);
  var diAct=document.getElementById("dirActividades");if(diAct)diAct.addEventListener("input",function(e){S.sol.directa.actividades=e.target.value;});
  var diHor=document.getElementById("dirHoras");if(diHor)diHor.addEventListener("input",function(e){S.sol.directa.horas=e.target.value;});
  document.querySelectorAll("[data-dtipo]").forEach(function(el){el.addEventListener("click",function(){directaTipo(el.dataset.dtipo);});});
  document.querySelectorAll("[data-dsub]").forEach(function(el){el.addEventListener("click",function(){directaSubtipo(el.dataset.dsub);});});

  // MÁQUINAS, OPERACIONES, PARTES (globales)
  document.querySelectorAll("[data-maq]").forEach(function(el){el.addEventListener("click",function(){setMaq(el.dataset.ns,el.dataset.maq);});});
  document.querySelectorAll("[data-op]").forEach(function(el){el.addEventListener("click",function(){setOp(el.dataset.ns,el.dataset.op);});});
  document.querySelectorAll("[data-del]").forEach(function(el){el.addEventListener("click",function(){delPartida(parseInt(el.dataset.del));});});
  document.querySelectorAll("[data-parte]").forEach(function(el){el.addEventListener("click",function(){selParte(el.dataset.ns,el.dataset.parte);});});
  document.querySelectorAll("[data-search]").forEach(function(el){
    el.addEventListener("input",function(){
      var ns=el.dataset.search,q=el.value;
      if(ns.indexOf("prod_")===0){var i=parseInt(ns.replace("prod_",""));S.prod.partidas[i].q=q;S.prod.partidas[i].noParte="";S.prod.partidas[i].operacion="";S.prod.partidas[i].desc="";}
      else if(ns==="setup"){S.setup.q=q;S.setup.noParte="";S.setup.operacion="";}
      else if(ns==="edit"){S.editando.q=q;S.editando.noParte="";S.editando.operacion="";}
      updateResults(ns,q);
    });
  });
  document.querySelectorAll("[data-piezas]").forEach(function(el){el.addEventListener("input",function(){S.prod.partidas[parseInt(el.dataset.piezas)].piezas=el.value;});});
  document.querySelectorAll("[data-horas]").forEach(function(el){el.addEventListener("input",function(){S.prod.partidas[parseInt(el.dataset.horas)].horas=el.value;});});
  document.querySelectorAll("[data-ot]").forEach(function(el){el.addEventListener("input",function(){S.prod.partidas[parseInt(el.dataset.ot)].ot=el.value;});});
  document.querySelectorAll("[data-desc]").forEach(function(el){el.addEventListener("input",function(){S.prod.partidas[parseInt(el.dataset.desc)].desc=el.value;});});
}

function updateResults(ns,q){
  var PART_LIST=["Otro"].concat(Object.keys(CAT.partes).sort());
  var ql=q.toLowerCase(),lista=q.length>1?PART_LIST.filter(function(p){return p.toLowerCase().indexOf(ql)>=0;}).slice(0,15):[];
  var inputs=document.querySelectorAll('[data-search="'+ns+'"]');if(!inputs.length)return;
  var wrap=inputs[0].closest(".field");if(!wrap)return;
  var sel=wrap.querySelector(".selected-parte");if(sel)sel.remove();
  var div=wrap.querySelector(".search-results");
  if(!lista.length){if(div)div.remove();return;}
  if(!div){div=document.createElement("div");div.className="search-results";wrap.appendChild(div);}
  var html="";lista.forEach(function(p){html+='<button class="search-result-btn" data-ns="'+ns+'" data-parte="'+p+'">'+p+'</button>';});
  div.innerHTML=html;
  div.querySelectorAll("[data-parte]").forEach(function(el){el.addEventListener("click",function(){selParte(el.dataset.ns,el.dataset.parte);});});
}

// ============================================================
// ENVIOS PRODUCCION/SETUP/MANTO
// ============================================================

function sendProd(){
  if(!S.prod.maquina){alert("Selecciona una maquina.");return;}
  if(!S.prod.partidas[0].noParte){alert("Selecciona al menos un numero de parte.");return;}
  for(var x=0;x<S.prod.partidas.length;x++){var pt=S.prod.partidas[x];if(!pt.ot){alert("La orden de trabajo es obligatoria en la partida "+(x+1)+".");return;}if(!pt.operacion){alert("Selecciona una operacion en la partida "+(x+1)+".");return;}}
  S.sending=true;render();
  var fecha=getFecha(),hora=getHora();
  var promises=S.prod.partidas.filter(function(pt){return pt.noParte;}).map(function(pt){
    var esOtro=pt.noParte==="Otro";
    return enviar({fecha:fecha,turno:S.turno,tipo:"Producción",maquina:S.prod.maquina,responsable:S.empleado.numero+" - "+S.empleado.nombre,noParte:esOtro?"Otro - "+(pt.desc||""):pt.noParte,ordenTrabajo:pt.ot||"",tipoOperacion:pt.operacion?getTipoOp(pt.operacion):"",operacion:pt.operacion,piezas:esOtro?"":pt.piezas,horasSetup:esOtro?pt.horas:"",horasManto:"",tipoManto:"",descripcion:""});
  });
  Promise.all(promises).then(function(){
    S.history.unshift({tipo:"Producción",fecha:fecha,hora:hora,turno:S.turno,maquina:S.prod.maquina});
    S.submitted={tipo:"Producción",fecha:fecha,hora:hora,turno:S.turno,maquina:S.prod.maquina,partidas:S.prod.partidas.slice()};
    S.prod={maquina:"",partidas:[mkPartida()]};S.miturno.data=null;S.sending=false;S.view="done";render();
  });
}

function sendSetup(){
  if(!S.setup.maquina){alert("Selecciona una maquina.");return;}
  if(!S.setup.noParte){alert("Selecciona un numero de parte.");return;}
  if(!S.setup.ot){alert("La orden de trabajo es obligatoria.");return;}
  if(!S.setup.operacion){alert("Selecciona una operacion.");return;}
  S.sending=true;render();
  var fecha=getFecha(),hora=getHora();
  enviar({fecha:fecha,turno:S.turno,tipo:"Setup",maquina:S.setup.maquina,responsable:S.empleado.numero+" - "+S.empleado.nombre,noParte:S.setup.noParte,ordenTrabajo:S.setup.ot||"",tipoOperacion:S.setup.operacion?getTipoOp(S.setup.operacion):"",operacion:S.setup.operacion,piezas:"",horasSetup:S.setup.horas,horasManto:"",tipoManto:"",descripcion:""})
  .then(function(){
    S.history.unshift({tipo:"Setup",fecha:fecha,hora:hora,turno:S.turno,maquina:S.setup.maquina});
    S.submitted={tipo:"Setup",fecha:fecha,hora:hora,turno:S.turno,maquina:S.setup.maquina,noParte:S.setup.noParte,operacion:S.setup.operacion,horas:S.setup.horas,ot:S.setup.ot};
    S.setup={maquina:"",noParte:"",operacion:"",horas:"",ot:"",q:""};S.miturno.data=null;S.sending=false;S.view="done";render();
  });
}

function sendManto(){
  if(!S.manto.maquina){alert("Selecciona una maquina.");return;}
  if(!S.manto.tipo){alert("Selecciona un tipo de mantenimiento.");return;}
  if(tipoTieneSub(S.manto.tipo)&&!S.manto.subtipo){alert("Selecciona subcategoria.");return;}
  S.sending=true;render();
  var fecha=getFecha(),hora=getHora();
  var tipoFinal=S.manto.subtipo?(S.manto.tipo+" - "+S.manto.subtipo):S.manto.tipo;
  enviar({fecha:fecha,turno:S.turno,tipo:"Mantenimiento",maquina:S.manto.maquina,responsable:S.empleado.numero+" - "+S.empleado.nombre,noParte:"",ordenTrabajo:"",tipoOperacion:"",operacion:"",piezas:"",horasSetup:"",horasManto:S.manto.horas,tipoManto:tipoFinal,descripcion:S.manto.descripcion})
  .then(function(){
    S.history.unshift({tipo:"Mantenimiento",fecha:fecha,hora:hora,turno:S.turno,maquina:S.manto.maquina});
    S.submitted={tipo:"Mantenimiento",fecha:fecha,hora:hora,turno:S.turno,maquina:S.manto.maquina,tipoManto:tipoFinal,descripcion:S.manto.descripcion,horas:S.manto.horas};
    S.manto={maquina:"",tipo:"",subtipo:"",descripcion:"",horas:""};S.miturno.data=null;S.sending=false;S.view="done";render();
  });
}

// ============================================================
// INICIALIZACION
// ============================================================

Promise.all([
  fetchCat("empleados"),
  fetchCat("operaciones"),
  fetchCat("partes"),
  fetchCat("tiposmanto"),
  fetchCat("maquinas")
]).then(function(results){
  CAT={
    empleados:results[0]||[],
    operaciones:results[1]||[],
    partes:results[2]||{},
    tiposmanto:results[3]||{principales:TIPOS_MANTO_DEFAULT,sub:{}},
    maquinas:results[4]||[]
  };
  S.view="login";render();
}).catch(function(err){
  document.getElementById("app").innerHTML='<div style="padding:2rem;text-align:center;color:#E24B4A;font-size:16px">Error al cargar catalogos. Verifica conexion.<br><span style="font-size:12px">'+(err&&err.message?err.message:"")+'</span></div>';
});

</script>
